#
# Widevine L1 & OEM Keystore Preservation Configuration
# Target: Lenovo Tab M11 (TB311FU, MediaTek Helio G88 / MT6769)
#

[hardware_root_of_trust]
tee_provider = "Microtrust MTEE"
soc = "MT6769"
chip_id_efuse_binding = true
target_security_level = "L1"

[critical_partitions]
# Partitions storing unique cryptographic keys, device calibration, and attestation markers:
partitions = [
    "nvram",      # 64MB - Raw radio, calibration, and unique hardware identifiers
    "nvdata",     # 64MB - EXT4 filesystem synced with NVRAM
    "protect1",   # 16MB (protect_f) - Factory hardware calibration
    "protect2",   # 16MB (protect_s) - TEE keybox store & Widevine L1 credential blobs
    "proinfo",    # 3MB  - Lenovo factory barcodes and product markers
    "persist",    # OEM persistent parameters & secure DRM certificates
    "seccfg"      # Security configuration partition
]

[preservation_rules]
# 1. Mount Policy: Enforce strictly read-only mounts in fstab for protect1, protect2, persist
mount_flags_protect1 = "ro,noatime,nosuid,nodev"
mount_flags_protect2 = "ro,noatime,nosuid,nodev"
mount_flags_persist  = "ro,noatime,nosuid,nodev"

# 2. Updater Rules: Custom ROM zip installers MUST NOT format or overwrite critical partitions
exclude_from_ota_payload = true
disallow_format_commands = ["protect1", "protect2", "protect_f", "protect_s", "nvram", "nvdata", "proinfo"]

# 3. Fastbootd / LK Unlock Guards
# fastboot -w (factory reset) MUST format only userdata and cache
wipe_whitelist = ["userdata", "cache", "metadata"]

# 4. BROM Pre-Unlock Backup
brom_backup_command = "python mtk.py r nvram,nvdata,protect1,protect2,proinfo,persist backup_drm/"
